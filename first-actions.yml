name: Self Hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display runner information
        run: |
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Arch: $RUNNER_ARCH"
          hostname
          pwd

      - name: Test execution
        run: |
          echo "Hello from Self-Hosted Runner!"
          date

      - name: List files
        run: ls -la
