name: Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Display Runner Details
        run: |
          echo "===== RUNNER DETAILS ====="
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Arch: $RUNNER_ARCH"
          echo "Hostname: $(hostname)"
          echo "Current User: $(whoami)"
          echo "Working Directory: $(pwd)"

      - name: Create Test File On Runner
        run: |
          echo "Job executed on $(hostname) at $(date)" > selfhosted_test.txt
          cat selfhosted_test.txt

      - name: Check Home Directory
        run: |
          ls -la ~
          ls -la

      - name: Show System Information
        run: |
          df -h
          free -m || true
          uname -a

      - name: Success Message
        run: |
          echo "✅ This workflow is running on SELF-HOSTED RUNNER"
