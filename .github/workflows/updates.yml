name: Runner Verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Verify Runner
        run: |
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          hostname
          date
          touch /tmp/github-test.txt
          ls -l /tmp/github-test.txt
