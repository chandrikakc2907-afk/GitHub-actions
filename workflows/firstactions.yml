name: Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display runner details
        run: |
          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Temp: $RUNNER_TEMP"
          echo "Workspace: $GITHUB_WORKSPACE"
          hostname
          whoami

      - name: Create proof file on runner
        run: |
          echo "Job executed on self-hosted runner at $(date)" > /tmp/selfhosted-test.txt
          cat /tmp/selfhosted-test.txt

      - name: Show machine information
        run: |
          echo "CPU Details"
          lscpu | head -15

          echo "Memory Details"
          free -h

          echo "Disk Details"
          df -h

